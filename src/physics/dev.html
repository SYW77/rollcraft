<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>physics dev</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: ui-monospace, monospace;
      }
      #info {
        position: absolute;
        top: 8px;
        left: 8px;
        background: #fffc;
        padding: 6px 10px;
        line-height: 1.5;
        white-space: pre;
        font-size: 13px;
      }
      /* [프로토타입] 클라이머 판 */
      #climb {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        background: #fffe;
        padding: 8px;
        border: 1px solid #bbb;
        font-size: 12px;
        text-align: center;
      }
      #climb canvas {
        display: block;
        background: #f6f6f6;
        cursor: crosshair;
        touch-action: none;
        margin: 4px auto;
      }
    </style>
  </head>
  <body>
    <!-- 물리 단독 실행: npm run dev 후 /src/physics/dev.html -->
    <div id="info"></div>
    <div id="climb">
      <b>클라이머</b> (Draw Climber 방식) · 달리는 중 아무 때나 다시 그리기
      <canvas width="200" height="200"></canvas>
      <button id="climb-go">클라이머 시작 (시험 코스)</button>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import * as CANNON from 'cannon-es';
      import { createPhysicsWorld } from './physicsWorld.js';
      import { createPlayer } from './PlayerBody.js';
      import { createClimber } from './climber.js';
      import { buildTestCourse } from './testCourse.js';
      import { createDebugView } from './debugView.js';
      import { getPreset, PRESET_NAMES } from '../shared/presets.js';
      import { buildLatheGeometry } from '../editor/latheGeometry.js';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdddddd);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));
      const sun = new THREE.DirectionalLight(0xffffff, 1.5);
      sun.position.set(5, 10, 3);
      scene.add(sun);
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
      addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });

      const physics = createPhysicsWorld();
      const ground = new CANNON.Body({
        mass: 0,
        shape: new CANNON.Box(new CANNON.Vec3(50, 0.5, 50)),
      });
      ground.position.set(0, -0.5, 0);
      physics.world.addBody(ground);
      scene.add(new THREE.GridHelper(100, 100));

      const spawn = { position: new THREE.Vector3(0, 1, 0), heading: { x: 0, z: -1 } };
      let presetIndex = 0;
      let player = null;
      let debug = null;
      let showDebug = true;
      let showMesh = true;
      let sideCam = false; // V: 옆에서 보기
      let climbing = false; // 클라이머 모드 (다시 그리면 그 자리에서 다리 교체)
      let climbDrawing = false; // 클라이머 판에 그리는 중 (느리게)

      function replacePlayer(make) {
        debug?.dispose();
        player?.dispose();
        player = make();
        player.mesh.visible = showMesh;
        if (player.legsMesh) player.legsMesh.visible = showMesh;
        debug = createDebugView({ body: player.body, scene });
        debug.setVisible(showDebug);
      }

      function load(i) {
        climbing = false;
        presetIndex = (i + PRESET_NAMES.length) % PRESET_NAMES.length;
        const profile = getPreset(PRESET_NAMES[presetIndex]);
        replacePlayer(() =>
          createPlayer({
            profile,
            geometry: buildLatheGeometry(profile, 32),
            world: physics.world,
            scene,
            spawn,
          }),
        );
      }
      load(presetIndex);

      const keys = {};
      addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.target !== document.body) return;
        if (e.code === 'KeyR') climbing ? spawnClimber(false) : player.reset(spawn);
        if (e.code.startsWith('Digit')) {
          const n = Number(e.code.slice(5)) - 1;
          if (n >= 0 && n < PRESET_NAMES.length) load(n);
        }
        if (e.code === 'KeyC') debug.setVisible((showDebug = !showDebug));
        if (e.code === 'KeyV') sideCam = !sideCam;
        if (e.code === 'KeyM') {
          showMesh = !showMesh;
          player.mesh.visible = showMesh;
          if (player.legsMesh) player.legsMesh.visible = showMesh;
        }
      });
      addEventListener('keyup', (e) => (keys[e.code] = false));

      // ── [프로토타입] 클라이머 판 ──
      // 빈 캔버스에 선 하나: 펜을 댄 시작점(●)이 몸통 회전축에 붙고, 양옆 다리(반대쪽은 180° 엇갈림)가 되어 돈다.
      // 달리는 중 다시 그리면 그 자리에서 바뀐다.
      const cpad = document.querySelector('#climb canvas');
      const cctx = cpad.getContext('2d');
      let climbStroke = [];
      let course = null;
      function drawClimbPad() {
        const W = cpad.width;
        cctx.clearRect(0, 0, W, W);
        if (!climbStroke.length) return;
        cctx.fillStyle = '#e0a030'; // 시작점 = 몸통에 붙는 곳
        cctx.beginPath();
        cctx.arc(climbStroke[0].x, climbStroke[0].y, 6, 0, Math.PI * 2);
        cctx.fill();
        cctx.strokeStyle = '#222';
        cctx.lineWidth = 3;
        cctx.lineCap = cctx.lineJoin = 'round';
        cctx.beginPath();
        climbStroke.forEach((p, k) => (k ? cctx.lineTo(p.x, p.y) : cctx.moveTo(p.x, p.y)));
        cctx.stroke();
      }
      function spawnClimber(keepState) {
        const W = cpad.width;
        const stroke = climbStroke.map((p) => ({
          x: (p.x - W / 2) / (W / 2),
          y: (W / 2 - p.y) / (W / 2),
        }));
        const snap = keepState && climbing ? player.snapshot() : null;
        replacePlayer(() => createClimber({ stroke, world: physics.world, scene, spawn }));
        if (snap) player.restore(snap); // 달리는 중이면 그 자리에서 이어 달리기
        climbing = true;
      }
      const cpos = (e) => {
        const r = cpad.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      };
      cpad.addEventListener('pointerdown', (e) => {
        try {
          cpad.setPointerCapture(e.pointerId);
        } catch {
          // 합성 이벤트 등 캡처할 수 없는 포인터
        }
        climbDrawing = true;
        climbStroke = [cpos(e)];
        drawClimbPad();
      });
      cpad.addEventListener('pointermove', (e) => {
        if (!climbDrawing) return;
        const p = cpos(e);
        const q = climbStroke[climbStroke.length - 1];
        if (Math.hypot(p.x - q.x, p.y - q.y) > 2) climbStroke.push(p);
        drawClimbPad();
      });
      cpad.addEventListener('pointerup', () => {
        climbDrawing = false;
        drawClimbPad();
        if (climbing && climbStroke.length > 1) spawnClimber(true); // 달리는 중이면 그 자리에서 다리 교체
      });
      document.getElementById('climb-go').onclick = (e) => {
        e.target.blur();
        if (!course) course = buildTestCourse(physics.world, scene);
        sideCam = true;
        spawnClimber(false);
      };
      drawClimbPad();

      const $info = document.getElementById('info');
      let last = performance.now();
      let yMin = Infinity;
      let yMax = -Infinity;
      let windowStart = 0;
      renderer.setAnimationLoop((now) => {
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        const input = {
          forward: !!keys.KeyW,
          back: !!keys.KeyS,
          left: !!keys.KeyA,
          right: !!keys.KeyD,
        };
        physics.step(climbDrawing ? dt * 0.2 : dt); // 클라이머: 그리는 동안 느리게
        player.update(dt, input, spawn.heading);
        debug.update();

        const b = player.body;
        const p = player.getPosition();
        // 클라이머: 옆에서 조금 앞쪽으로 돌린 시점 (캐릭터 얼굴이 보이게)
        if (sideCam && climbing) camera.position.set(p.x + 6, p.y + 1.6, p.z - 2.5);
        else if (sideCam) camera.position.set(p.x + 4, p.y + 0.8, p.z);
        else camera.position.set(p.x + 3, p.y + 3, p.z + 5);
        camera.lookAt(p);

        // 최근 0.5초 동안 무게중심 높이 흔들림 = 튐 지표
        yMin = Math.min(yMin, b.position.y);
        yMax = Math.max(yMax, b.position.y);
        if (now - windowStart > 500) {
          $info.dataset.bounce = ((yMax - yMin) * 100).toFixed(1);
          yMin = Infinity;
          yMax = -Infinity;
          windowStart = now;
        }
        const speed = Math.hypot(b.velocity.x, b.velocity.z);
        const axis = player.getAxis();
        const mode = climbing
          ? `클라이머 (다리 ${player.legSegments}조각)`
          : player.axle
            ? 'axle (자기 축)'
            : 'free (화면 기준)';
        $info.textContent =
          `physics sandbox\n` +
          `[1-${PRESET_NAMES.length}] ${PRESET_NAMES.map((n, i) => (!climbing && i === presetIndex ? `[${n}]` : n)).join(' ')}\n` +
          `W/S 구르기  A/D 조향  R 리셋  C 콜라이더  M 메쉬  V 옆에서 보기\n\n` +
          `조작 모드  ${mode}\n` +
          `질량       ${player.mass.toFixed(2)} kg\n` +
          `속력       ${speed.toFixed(2)} m/s\n` +
          `축 기울기  ${((Math.asin(Math.min(1, Math.abs(axis.y))) * 180) / Math.PI).toFixed(0)}°\n` +
          `튐 (0.5s)  ${$info.dataset.bounce ?? '-'} cm`;
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
