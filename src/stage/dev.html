<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>stage dev</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- 스테이지 단독 실행: npm run dev 후 /src/stage/dev.html (마우스 없이 위에서 내려다봄) -->
    <script type="module">
      import * as THREE from 'three';
      import { createPhysicsWorld } from '../physics/physicsWorld.js';
      import { getMaterials } from '../render/materials.js';
      import { setupLighting } from '../render/lighting.js';
      import { createEmitter } from '../shared/events.js';
      import { buildStage } from './buildStage.js';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfd8ec);
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
      const { world } = createPhysicsWorld();
      const stage = buildStage({
        scene,
        world,
        events: createEmitter(),
        materials: getMaterials(),
      });

      // 트랙 중심선 전체가 보이도록 비스듬히 위에서 내려다본다
      const box = new THREE.Box3().setFromPoints(
        stage.path.points.map((p) => new THREE.Vector3(p.x, 0, p.z)),
      );
      const center = box.getCenter(new THREE.Vector3());
      const span = box.getSize(new THREE.Vector3()).length();
      camera.position.set(center.x + span * 0.35, span * 0.75, center.z + span * 0.45);
      camera.lookAt(center);

      // 중심선 표시 (heading 확인용)
      scene.add(
        new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(
            stage.path.points.map((p) => new THREE.Vector3(p.x, 0.05, p.z)),
          ),
          new THREE.LineBasicMaterial({ color: 0xffff00 }),
        ),
      );
      setupLighting({ scene, renderer }).update(center);
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    </script>
  </body>
</html>
