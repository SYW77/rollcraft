<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RollCraft</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game,
      #ui,
      #editor {
        position: absolute;
        inset: 0;
      }
      #ui {
        pointer-events: none;
      }
      #ui > * {
        pointer-events: auto;
      }
      #editor:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- 컨테이너 div만 둔다. 각 모듈은 자기 컨테이너 안에만 DOM을 만든다. -->
    <div id="game"></div>
    <div id="ui"></div>
    <div id="editor"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
