# Render 배포 설정 (게임 화면 + 멀티 중계 서버를 주소 하나로). 담당: 원유승
# Render 대시보드: New → Blueprint → 이 레포 연결 → 이 파일을 읽어 서비스를 만든다.
services:
  - type: web
    name: rollcraft
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
